title = "Gitleaks classroom rules"

[extend]
useDefault = true

[[rules]]
id = "classroom-aws-example"
description = "Published AWS example used in the classroom"
path = '''(^|/)config\.py$'''
regex = '''(?m)^AWS_ACCESS_KEY_ID\s*=\s*"(AKIAIOSFODNN7EXAMPLE)"'''
secretGroup = 1

[[rules]]
id = "sakib-fictional-service-key"
description = "Fictional Sakib service key for classroom testing"
path = '''(^|/)config\.py$'''
regex = '''\bSAKIB-KEY-[0-9]{8}\b'''
